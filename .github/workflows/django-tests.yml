name: Django contact API tests

on:
  push:
    branches:
      - redesign/homepage-v1
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run contact API tests
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test contact -v 2
